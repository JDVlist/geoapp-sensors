services:
  db:         
    image: postgis/postgis:18-master
    restart: unless-stopped
    ports:
      - 54321:5432          # localhost port : port reference inside container 
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./.postgis:/var/lib/postgresql        # make a persistent volume in your files of the repo

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432   # container port for db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./api:/app
      
